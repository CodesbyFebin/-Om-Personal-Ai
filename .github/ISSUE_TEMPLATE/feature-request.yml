name: Feature request
description: Propose a focused improvement to OM
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Infrastructure requirement
      options:
        - Application-only
        - Requires owned external service
        - Requires secrets or OAuth
        - Requires sandbox/edge execution
        - Unsure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: What test or measured result proves this is complete?
