name: om-private-universe
services:
  ollama-bootstrap:
    profiles: ["bootstrap"]
    image: ollama/ollama:latest
    volumes: ["ollama:/root/.ollama"]
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & pid=$$!; sleep 3; ollama pull $${OM_MODEL}; kill $$pid"]
    environment:
      OM_MODEL: "${OM_MODEL:-qwen2.5-coder:14b}"
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    environment:
      OLLAMA_ORIGINS: "${OM_ALLOWED_ORIGIN:-http://localhost:3000}"
    networks: [om-private]
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["om-data:/data"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set in .env}"
    networks: [om-private]
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["god-memory:/qdrant/storage"]
    networks: [om-private]
  ipfs:
    image: ipfs/kubo:latest
    restart: unless-stopped
    ports: ["127.0.0.1:5001:5001"]
    volumes: ["ipfs-data:/data/ipfs"]
    networks: [om-private]
  edge-node:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8787:80"]
    volumes: ["./edge-node.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [om-private]
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    restart: unless-stopped
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337"]
    ports: ["127.0.0.1:8545:8545"]
    networks: [om-private]
networks:
  om-private:
    internal: true
volumes:
  ollama:
  om-data:
  god-memory:
  ipfs-data:
